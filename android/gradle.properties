org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# There is one Kotlin file in this app — MainActivity, twelve lines. The forked
# Kotlin compile daemon it would otherwise spawn hung here: idle at 0% CPU with
# Gradle blocked waiting on it, and it holds itself open for two hours. Compiling
# in-process removes the daemon, and the handshake that hung, entirely.
kotlin.compiler.execution.strategy=in-process
